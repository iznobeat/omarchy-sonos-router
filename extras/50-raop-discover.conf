# Discover AirPlay (RAOP) speakers, incl. Sonos, and expose them as output sinks
context.modules = [
  {
    name = libpipewire-module-raop-discover
    args = {
      stream.rules = [
        {
          matches = [ { raop.ip = "~.*" } ]
          actions = {
            create-stream = {
              # Larger buffers to avoid dropouts/crackling over Wi-Fi
              raop.latency.ms   = 2000
              sess.latency.msec = 998
            }
          }
        }
      ]
    }
  }
]
